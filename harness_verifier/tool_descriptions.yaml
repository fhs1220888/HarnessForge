# EVOLVABLE COMPONENT — edits to this file go through the self-harness validation gate.

tools:
  - name: bash
    description: >
      Run a shell command in the task sandbox. Returns stdout, stderr, and exit code.
      During mandatory verification, use commands that can falsify the deliverable;
      do not use no-op commands merely to satisfy the gate.
    input_schema:
      type: object
      properties:
        command: { type: string, description: "Shell command to run" }
        timeout_s: { type: integer, description: "Timeout in seconds", default: 60 }
      required: [command]

  - name: read_file
    description: Read a file with line numbers. Use offset/limit for large files.
    input_schema:
      type: object
      properties:
        path: { type: string }
        offset: { type: integer, default: 0 }
        limit: { type: integer, default: 500 }
      required: [path]

  - name: write_file
    description: Create or overwrite a file. Verification evidence resets after this tool.
    input_schema:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
      required: [path, content]

  - name: apply_patch
    description: >
      Apply a unified diff atomically. Verification evidence resets after this tool.
    input_schema:
      type: object
      properties:
        patch: { type: string, description: "Unified diff" }
      required: [patch]

  - name: finish
    description: >
      Propose completion. The first done proposal starts mandatory independent
      verification; call again only after post-edit verification evidence.
    input_schema:
      type: object
      properties:
        status: { type: string, enum: [done, gave_up] }
        summary: { type: string }
      required: [status, summary]
