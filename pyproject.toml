[project]
name = "harnessforge"
version = "0.1.0"
description = "Self-evolving coding-agent harness lab"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "toml>=0.10",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Ruff is pre-1.0: minor releases may enable new default rules. Pin the
    # validated lint contract so CI cannot change underneath a source commit.
    "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
