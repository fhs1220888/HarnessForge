name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Offline evidence demo
        # Rebuilds the scorecard from checked-in evidence and fails on metric drift.
        run: python -m harnessforge.demo
      - name: Test
        # Unit tests + mock-LLM end-to-end loops. No API key, Docker, or API cost.
        run: pytest -q --junitxml=.pytest-results.xml
      - name: Annotate test failures
        if: failure()
        run: python scripts/annotate_pytest_failures.py .pytest-results.xml
